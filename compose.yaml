services:
  atlas:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      ATLAS_LLM_KIND: openai
      ATLAS_LLM_BASE: https://api.openai.com/v1
      ATLAS_LLM_MODEL: gpt-6-luna
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATLAS_ORIGINS: http://127.0.0.1:8765,http://localhost:8765
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atlas-data:/data
    init: true
volumes:
  atlas-data:
