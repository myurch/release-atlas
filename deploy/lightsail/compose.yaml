name: release-atlas
services:
  atlas:
    image: release-atlas:${ATLAS_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.hosted"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    env_file:
      - path: ${ATLAS_RUNTIME_ENV:-/etc/release-atlas/runtime.env}
        format: raw
    environment:
      ATLAS_SITE_ORIGIN: ${ATLAS_SITE_ORIGIN:?Set the exact HTTPS GPT Site origin}
      ATLAS_BACKEND_ORIGIN: https://${ATLAS_BACKEND_HOSTNAME:?Set the backend DNS hostname}
      ATLAS_DATA_DIR: /data
      PORT: "8765"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - atlas_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      atlas:
        condition: service_healthy
    environment:
      ATLAS_BACKEND_HOSTNAME: ${ATLAS_BACKEND_HOSTNAME:?Set the backend DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  atlas_data:
  caddy_data:
  caddy_config:
